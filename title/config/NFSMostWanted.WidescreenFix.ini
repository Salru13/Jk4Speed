; ThirteenAG's Widescreen Fix (WidescreenFixesPack, GPL-3.0, release "nfsmw", source a13a14a) for
; the ORIGINAL game side of JK4SPEED 1.1. Only the widescreen picture is on: 16:9 FOV, HUD, menus and
; FMVs. Everything else is off so the game plays exactly like the Black Edition side:
; no gamepad remap (our CONTROLS page and Xidi own the pad), no SimRate (JK4SPEED's own 30/60
; pacer), no colour, audio, shadow or GPU-vendor changes, no free-look camera.
; The resolution is 1920x1080 from the registry (the launcher seeds it at the first PLAY).

[LANGUAGE]
Language =

[MAIN]
FixHUD = 1
FixFOV = 1
Scaling = 1
HudAspectRatioConstraint = Auto
FMVWidescreenMode = 1
FEScale = 1.00
FMVScale = 1.00
AutoFitFE = 1
AutoFitFMV = 1

[MISC]
SkipIntro = 0
WindowedMode = 0
CustomUserFilesDirectoryInGameDir = 0
WriteSettingsToFile = 0
ImproveGamepadSupport = 0
LeftStickDeadzone = 10.0
RightStickDeadzone = 10.0
ForceHighSpecAudio = 0
SimRate = 0

[GRAPHICS]
ShadowsRes = 1024
ShadowsFix = 0
ImproveShadowLOD = 0
AutoScaleShadowsRes = 0
ShadowMapTextureFormat = -1
ForceSharpShadows = 0
RainDropletsScale = 0.5
DisableMotionBlur = 0
LightStreaksEnable = 0
BleachByPassEnable = 0
ForcedGPUVendor = 0
ConsoleGamma = 0
SMAA = 0
HideAABug = 0

[CAMERA]
; Off for 1.10 (owner 2026-11-27): the free look did not move on the Slim (Enable 1, horizontal only)
; although Xidi's XInputNative template puts the right stick X on RotX, the lRx the fix reads; the
; cause (the fix's foreground-window check under Wine, or its camera hook) is follow-up work.
; Right stick back = look back, as on the Black Edition side.
Enable = 0

[NOSTrail]
FixNOSTrailLength = 0
FixNOSTrailPosition = 0
