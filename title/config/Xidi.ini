; Xidi mapping for NFS Most Wanted (2005) on the PS4, release layout locked 2026-11-23;
; 2026-11-23 owner camera layout: R3 = Change Camera View (profile key C), right stick back = Look Behind.
; Loaded by the Ultimate ASI Loader dinput8.dll (63b465db) chain-loading Xidi.32.dll (226624ef, ThirteenAG
; Xidi fork 085d7c09); syntax is Xidi v5.0.0 CustomMapper (https://github.com/samuelgr/Xidi/wiki).
; Game pad bindings are the stock ones (bench/controls/CURRENT-BINDINGS.md); this file only moves the
; DS4 controls onto the virtual buttons the game already uses. No save file or in-game menu change.
;
;   DS4 (XInput name)     Xidi output   Game action
;   R2 (RT)               Button(1)     Accelerate
;   L2 (LT)               Button(3)     Brake / Reverse (also front-end back)
;   Cross (A)             Button(2)     Handbrake, front-end accept
;   Circle (B)            Button(3)     Brake / Reverse, front-end back
;   Square (X)            Button(7)     N2O
;   Triangle (Y)          Button(4)     Speedbreaker
;   R3 (RS)               Null          nothing via Xidi; the runtime profile sends key C (Change Camera View)
;   Right stick pulled    Button(5)     Look Behind (held while the stick is back; pushed up = nothing)
;   L3 (LS)               Button(6)     Reset Car Position
;   Options (Start)       Button(8)     Pause
;   L1 (LB), R1 (RB)      Button(11/12) nothing in the game; the runtime profile sends Ctrl/Shift
;                                       (keyboard Shift Down / Shift Up) for these two buttons.
;   Left stick X          X axis        Steering
;   D-pad                 POV           Engage event / Blacklist / Map / SMS (unchanged)

[CustomMapper:NFSMostWanted]
Template = XInputNative
TriggerRT = Button(1)
TriggerLT = Button(3)
ButtonA = Button(2)
ButtonB = Button(3)
ButtonX = Button(7)
ButtonY = Button(4)
ButtonRS = Null
; Split(positive, negative): positive half of a stick Y axis is down (stick pulled back), per the Xidi
; wiki StickLeftY example; Button() presses past Xidi's analog-pressed threshold, so small drift is ignored.
StickRightY = Split(Button(5), Null)
ButtonLS = Button(6)
ButtonStart = Button(8)
ButtonLB = Button(11)
ButtonRB = Button(12)
ButtonBack = Null

[Mapper]
Type = NFSMostWanted

[Properties]
; 0 = no vibration (Xidi v5.0.0 PhysicalController.cpp ScaledVibrationStrength returns 0). Owner: pad vibrated constantly.
ForceFeedbackEffectStrengthPercent = 0
